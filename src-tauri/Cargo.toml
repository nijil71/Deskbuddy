[package]
name = "deskbud"
version = "1.0.2"
description = "A living desktop buddy"
edition = "2021"

[lib]
name = "deskbud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
webview2-com = "0.39"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "qoi", "pnm"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Media_Control",
  "Foundation",
  "Win32_UI_Shell",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_System_LibraryLoader",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Globalization",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
