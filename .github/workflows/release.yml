name: Release

# Push a version tag (for example `git tag v1.0.4 && git push origin v1.0.4`) to build the
# Windows installers and publish them as a GitHub release. See CONTRIBUTING.md → "Releasing".
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish installers
    runs-on: windows-latest
    env:
      # Turns off the developer-only "local releases folder" update source (src-tauri/src/update.rs).
      DESKBUD_RELEASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $app in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - name: Build installers
        run: npx tauri build

      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/bundle/msi/*.msi out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Install

            1. Download **`Deskbud_x.y.z_x64-setup.exe`** below (the `.msi` is for IT deployment).
            2. Run it. If Windows shows "Windows protected your PC", click **More info → Run anyway**. Deskbud isn't code-signed yet; see the [README](https://github.com/nijil71/Deskbuddy#windows-protected-your-pc) for why.
            3. Your buddy appears on the taskbar. Right-click him for the menu.

            Already installed? Just run the new installer. Your settings and notes are kept.

            See [CHANGELOG.md](https://github.com/nijil71/Deskbuddy/blob/main/CHANGELOG.md) for what's new.
